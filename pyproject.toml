[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "curricumap"
version = "0.1.0"
description = "Turn registrar transcripts into auditable competency-domain matrices."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tarik Kucukdeniz" }, { name = "Tuncer Can" }]
dependencies = [
  "pandas>=2.0", "numpy>=1.24", "pyyaml>=6.0",
  "jsonschema>=4.0", "rapidfuzz>=3.0", "openpyxl>=3.1", "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
curricumap = "curricumap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/curricumap"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
